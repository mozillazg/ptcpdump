name: scan-cve

on:
  workflow_dispatch:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]
  schedule:
    - cron: "03 */24 * * *"

permissions:
  contents: read

jobs:

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        # renovate: datasource=golang-version depName=golang
        go-version: '1.27.1'

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Install Deps
      run: |
        sudo apt-get update && sudo apt-get install -y gcc flex bison make libelf-dev autoconf libpcap-dev

    - name: Run govulncheck for project
      run: |
        set -xe
        module_status=0
        symbol_status=0
        govulncheck -show verbose -scan module || module_status=$?
        govulncheck -show verbose -scan symbol ./... || symbol_status=$?
        # Fail only when both scans fail.
        if [ "$module_status" -ne 0 ] && [ "$symbol_status" -ne 0 ]; then
          exit 1
        fi

    - name: Build binary
      run: make build-via-docker

    - name: Run govulncheck for binary
      run: |
        set -xe
        module_status=0
        symbol_status=0
        govulncheck -mode=binary -show verbose -scan module ./ptcpdump || module_status=$?
        govulncheck -mode=binary -show verbose -scan symbol ./ptcpdump || symbol_status=$?
        # Fail only when both scans fail.
        if [ "$module_status" -ne 0 ] && [ "$symbol_status" -ne 0 ]; then
          exit 1
        fi
